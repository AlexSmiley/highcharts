name: Web dashboard CI
on:
  push:
    branches: [master, "modernization/**"]
    paths: ["web/**", ".github/workflows/web-ci.yml", "README.md"]
  pull_request:
    paths: ["web/**", ".github/workflows/web-ci.yml", "README.md"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
